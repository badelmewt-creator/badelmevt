<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>Badelmevt</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
    --bg:#010409;
    --panel:#0d1117;
    --accent:#00d2ff;
    --accent-glow:rgba(0,210,255,.2);
    --line:rgba(255,255,255,.08);
    --text:#fff;
    --muted:#8b949e;
    --input-bg:rgba(0,0,0,.3);
    --btn-bg:rgba(255,255,255,.03);
    --btn-active:rgba(255,255,255,.1);
}

*{
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    margin:0;
    padding:15px 0 120px;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    transition:.4s;
}

.container{
    width:calc(100% - 30px);
    max-width:420px;
    margin:auto;
}

header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.pinnacle-logo{
    width:50px;
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.pinnacle-svg{
    width:100%;
    height:100%;
    fill:none;
    stroke:var(--accent);
    stroke-width:2.8;
    filter:drop-shadow(0 0 5px var(--accent-glow));
}

.apex-text{
    font-size:24px;
    font-weight:900;
    letter-spacing:-.5px;
}

.top-settings-btn{
    width:42px;
    height:42px;
    border-radius:12px;
    border:1px solid var(--line);
    display:grid;
    place-items:center;
    color:var(--muted);
    cursor:pointer;
    background:var(--btn-bg);
    font-size:18px;
}

.top-settings-btn.active{
    color:var(--accent);
    border-color:var(--accent);
}

.tab-content{
    display:none;
    opacity:0;
    transform:translateX(30px);
}

.tab-content.active{
    display:block;
    animation:iosSlideIn .3s forwards;
}

@keyframes iosSlideIn{
    from{
        opacity:0;
        transform:translateX(30px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

.card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:18px;
    margin-bottom:12px;
}

.label{
    color:var(--muted);
    font-size:10px;
    font-weight:bold;
    text-transform:uppercase;
    margin-bottom:8px;
    display:block;
    letter-spacing:1px;
}

input{
    width:100%;
    background:var(--input-bg);
    border:2px solid var(--line);
    border-radius:15px;
    color:var(--accent);
    font-size:28px;
    text-align:right;
    padding:12px;
    outline:none;
    font-weight:bold;
}

input:focus{
    border-color:var(--accent);
}

.rate-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 5px;
    border-bottom:1px solid var(--line);
}

.rate-row.hidden{
    display:none;
}

.rate-val{
    color:var(--accent);
    font-size:26px;
    font-weight:800;
}

.copy-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--accent);
    width:38px;
    height:38px;
    border-radius:10px;
    cursor:pointer;
}

.copy-btn:active{
    background:var(--accent-glow);
    transform:scale(.95);
}

.calc-display-area{
    background:var(--input-bg);
    border:2px solid var(--line);
    border-radius:15px;
    padding:16px;
    margin-bottom:15px;
    text-align:right;
    overflow:hidden;
}

.calc-history{
    color:var(--muted);
    font-size:15px;
    min-height:20px;
    margin-bottom:5px;
}

.calc-current{
    color:var(--accent);
    font-size:40px;
    font-weight:800;
    word-break:break-all;
}

.calc-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
}

.calc-btn{
    background:var(--btn-bg);
    border:1px solid var(--line);
    color:var(--text);
    padding:18px 0;
    border-radius:15px;
    cursor:pointer;
    font-size:24px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
    touch-action:manipulation;
}

.calc-btn:active{
    transform:scale(.92);
    background:var(--btn-active);
}

.calc-btn.op{
    color:var(--accent);
}

.calc-btn.eq{
    background:var(--accent);
    color:#000;
    border:none;
    box-shadow:0 0 10px var(--accent-glow);
}

.color-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:10px;
}

.color-dot{
    height:40px;
    border-radius:10px;
    cursor:pointer;
    border:2px solid var(--line);
}

.setting-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
}

.btn-clear{
    width:100%;
    padding:15px;
    background:var(--btn-bg);
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
    font-size:12px;
}

.btn-outline-accent{
    border-color:var(--accent);
    color:var(--accent);
}

nav{
    position:fixed!important;
    bottom:15px!important;
    left:50%;
    transform:translateX(-50%);
    width:calc(100% - 30px);
    max-width:400px;
    background:var(--panel);
    backdrop-filter:blur(10px);
    display:grid;
    grid-template-columns:repeat(2,1fr);
    padding:8px;
    border-radius:25px;
    border:1px solid var(--line);
    z-index:9999;
    box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.nav-hidden{
    opacity:0!important;
    visibility:hidden!important;
    pointer-events:none!important;
}

.nav-item{
    background:transparent;
    border:none;
    color:var(--muted);
    font-weight:800;
    padding:12px;
    cursor:pointer;
    border-radius:18px;
    font-size:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
}

.nav-item.active{
    background:var(--btn-active);
    color:var(--accent);
}

.nav-icon-glass{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:30px;
    height:22px;
    border-radius:50px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
}

#copyHelper{
    position:absolute;
    left:-999px;
}
</style>
</head>

<body>

<div class="container">

<header>

<div style="display:flex;align-items:center;gap:14px;">

<div class="pinnacle-logo">
<svg class="pinnacle-svg" viewBox="0 0 100 100">
<path d="M50 15 L85 85 L50 70 L15 85 Z M50 15 L50 70"/>
</svg>
</div>

<div>
<div class="apex-text">SIZINTI</div>

<small style="color:var(--accent);font-weight:bold;">
Badelmevt v5.0
</small>

</div>

</div>

<div class="top-settings-btn" id="settings-btn" onclick="showSettings()">
<i class="fa-solid fa-sliders"></i>
</div>

</header>


<!-- YÜZDE -->

<div id="tab-yuzde" class="tab-content active">

<div class="card">

<span class="label">İhale Fiyatı</span>

<input
type="text"
id="fiyatInp"
inputmode="decimal"
placeholder="0,000"
oninput="hesapla()">

</div>

<div class="card" id="yuzdeListesi"></div>

<button class="btn-clear" onclick="resetYuzde()">
TÜMÜNÜ SIFIRLA
</button>

</div>


<!-- HESAP MAKİNESİ -->

<div id="tab-islem" class="tab-content">

<div class="card">

<div class="calc-display-area">

<div class="calc-history" id="calcHistory"></div>

<div class="calc-current" id="calcDisplay">
0
</div>

</div>

<div class="calc-grid">

<button class="calc-btn op" onclick="calcCommand('C')">
C
</button>

<button
class="calc-btn op"
onmousedown="startDel()"
onmouseup="stopDel()"
onmouseleave="stopDel()"
ontouchstart="startDel();event.preventDefault();"
ontouchend="stopDel()"
ontouchcancel="stopDel()">

<svg viewBox="0 0 24 24"
width="20"
height="20"
fill="none"
stroke="currentColor"
stroke-width="2">

<path d="M15 5h5a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-5l-7-7 7-7Z"/>
<line x1="12.5" y1="10" x2="18" y2="15.5"/>
<line x1="18" y1="10" x2="12.5" y2="15.5"/>

</svg>

</button>

<button class="calc-btn op" onclick="calcCommand('%')">
%
</button>

<button class="calc-btn op" onclick="calcCommand('/')">
÷
</button>

<button class="calc-btn" onclick="calcInput('7')">7</button>
<button class="calc-btn" onclick="calcInput('8')">8</button>
<button class="calc-btn" onclick="calcInput('9')">9</button>
<button class="calc-btn op" onclick="calcCommand('*')">×</button>

<button class="calc-btn" onclick="calcInput('4')">4</button>
<button class="calc-btn" onclick="calcInput('5')">5</button>
<button class="calc-btn" onclick="calcInput('6')">6</button>
<button class="calc-btn op" onclick="calcCommand('-')">-</button>

<button class="calc-btn" onclick="calcInput('1')">1</button>
<button class="calc-btn" onclick="calcInput('2')">2</button>
<button class="calc-btn" onclick="calcInput('3')">3</button>
<button class="calc-btn op" onclick="calcCommand('+')">+</button>

<button class="calc-btn" onclick="calcInput('00')">00</button>
<button class="calc-btn" onclick="calcInput('0')">0</button>
<button class="calc-btn" onclick="calcInput('.')">,</button>
<button class="calc-btn eq" onclick="calcCommand('=')">=</button>

</div>
</div>
</div>


<!-- AYARLAR -->

<div id="tab-ayarlar" class="tab-content">

<div class="card">

<span class="label">Solid Renk Paketi</span>

<div class="color-grid" id="solidColorGrid"></div>

</div>

<div class="card">

<span class="label">Görünür Oranlar</span>

<div id="switchListesi"></div>

</div>

<button
class="btn-clear"
style="margin-bottom:20px;"
onclick="closeSettings()">

KAYDET VE ÇIK

</button>

</div>

</div>


<!-- ALT MENÜ -->

<nav id="bottom-nav">

<button
class="nav-item active"
id="nav-yuzde"
onclick="showTab('tab-yuzde',this)">

<span class="nav-icon-glass">%</span>

Yüzdelik

</button>

<button
class="nav-item"
id="nav-islem"
onclick="showTab('tab-islem',this)">

<span class="nav-icon-glass">
<i class="fa-solid fa-calculator"></i>
</span>

Hesap Makinesi

</button>

</nav>

<textarea id="copyHelper"></textarea>


<script>

// SAĞ TIK ENGELİ

document.addEventListener('contextmenu',function(e){
e.preventDefault();
});


// GELİŞTİRİCİ ARAÇLARI ENGELİ

document.onkeydown=function(e){

if(
e.keyCode===123 ||
(e.ctrlKey && e.shiftKey &&
(e.keyCode===73 ||
e.keyCode===74 ||
e.keyCode===67)) ||
(e.ctrlKey && e.keyCode===85)
){

e.preventDefault();
return false;

}

};


// SADECE BU 5 ORAN VAR

const oranlar=[
85,
70,
55,
40,
30
];


// RENKLER

const solidColors=[
'#00d2ff','#ff3131','#008f39','#fff01f','#ff7f50',
'#8a2be2','#00ff7f','#ff1493','#00ced1','#ffd700',
'#ff4500','#da70d6','#adff2f','#1e90ff','#ff69b4',
'#32cd32','#8b4513','#4682b4','#d2691e','#9932cc',
'#2e8b57','#b22222','#20b2aa','#db7093'
];


let calcCurrent='0';
let calcPrev='';
let calcOp=undefined;
let shouldResetScreen=false;

let delTimeout;
let delInterval;


// BAŞLANGIÇ

window.onload=()=>{

initColors();
initRates();
loadSavedTheme();

};


// RENKLER

function initColors(){

const sGrid=document.getElementById('solidColorGrid');

solidColors.forEach(color=>{

sGrid.innerHTML+=`

<div
class="color-dot"
style="background:${color}"
onclick="setSolidTheme('${color}')">
</div>

`;

});

}


// ORANLARI OLUŞTUR

function initRates(){

const yList=document.getElementById('yuzdeListesi');
const sList=document.getElementById('switchListesi');

yList.innerHTML='';
sList.innerHTML='';


oranlar.forEach(o=>{

let icon='';
let customStyle='';


const trophySvg=color=>`

<svg viewBox="0 0 24 24"
width="16"
height="16"
fill="none"
stroke="${color}"
stroke-width="2"
style="margin-right:8px">

<path d="M8 21h8"/>
<path d="M12 17v4"/>
<path d="M7 4h10v5a5 5 0 0 1-10 0V4Z"/>
<path d="M17 5h2a2 2 0 0 1 2 2 4 4 0 0 1-4 4"/>
<path d="M7 5H5a2 2 0 0 0 4 4"/>

</svg>

`;


if(o===85){

icon=trophySvg('#FFD700');
customStyle='color:#FFD700!important;';

}

else if(o===70){

icon=trophySvg('#C0C0C0');
customStyle='color:#C0C0C0!important;';

}

else if(o===55){

icon=trophySvg('#CD7F32');
customStyle='color:#CD7F32!important;';

}


let valueStyle='';

if(o===40){

valueStyle='transform:translateX(10px);';

}

if(o===30){

/* %30 sonucu 1 karakter sağa */

valueStyle='transform:translateX(10px);';

}


yList.innerHTML+=`

<div class="rate-row" id="row-${o}">

<span style="display:flex;align-items:center;">
${icon}%${o}
</span>

<span
class="rate-val"
id="r${o}"
style="${valueStyle}${customStyle}">
0,00
</span>

<button
class="copy-btn"
onclick="kopyala('r${o}')">

<i class="fa-regular fa-copy"></i>

</button>

</div>

`;


sList.innerHTML+=`

<div class="setting-item">

<span>%${o} Göster</span>

<label class="switch">

<input
type="checkbox"
checked
onchange="toggleRate(${o},this.checked)">

<span class="slider"></span>

</label>

</div>

`;

});

}


// TEMA

function resetToDark(){

document.documentElement.style.setProperty('--text','#ffffff');
document.documentElement.style.setProperty('--panel','#0d1117');
document.documentElement.style.setProperty('--line','rgba(255,255,255,.08)');
document.documentElement.style.setProperty('--muted','#8b949e');
document.documentElement.style.setProperty('--input-bg','rgba(0,0,0,.3)');
document.documentElement.style.setProperty('--btn-bg','rgba(255,255,255,.03)');
document.documentElement.style.setProperty('--btn-active','rgba(255,255,255,.1)');

}


function loadSavedTheme(){

const val=
localStorage.getItem('apexThemeVal')||'#00d2ff';

setSolidTheme(val);

}


function setSolidTheme(hex){

document.body.removeAttribute('data-theme');

resetToDark();

document.documentElement.style.setProperty(
'--accent',
hex
);

document.documentElement.style.setProperty(
'--accent-glow',
hex+'44'
);

document.documentElement.style.setProperty(
'--bg',
'#010409'
);

localStorage.setItem(
'apexThemeType',
'solid'
);

localStorage.setItem(
'apexThemeVal',
hex
);

}


// SEKME

function showTab(id,btn){

document.querySelectorAll('.tab-content')
.forEach(t=>t.classList.remove('active'));

document.querySelectorAll('.nav-item')
.forEach(n=>n.classList.remove('active'));

document.getElementById('settings-btn')
.classList.remove('active');

const target=document.getElementById(id);

void target.offsetWidth;

target.classList.add('active');

if(btn){
btn.classList.add('active');
}

}


function showSettings(){

showTab('tab-ayarlar');

document.getElementById('settings-btn')
.classList.add('active');

}


function closeSettings(){

showTab(
'tab-yuzde',
document.getElementById('nav-yuzde')
);

}


function toggleRate(o,isVisible){

document
.getElementById(`row-${o}`)
.classList
.toggle('hidden',!isVisible);

}


// FORMAT

function format(n){

return new Intl.NumberFormat(
'tr-TR',
{
minimumFractionDigits:2,
maximumFractionDigits:2
}
).format(
Number(n.toFixed(3))
);

}


// HESAPLAMA

function hesapla(){

const val=
parseFloat(
document
.getElementById('fiyatInp')
.value
.replace(',','.')
)||0;


oranlar.forEach(o=>{

document.getElementById(
'r'+o
).innerText=
format((val*o)/100);

});

}


// SIFIRLA

function resetYuzde(){

document.getElementById(
'fiyatInp'
).value='';

hesapla();

}


// KOPYALA

function kopyala(id){

const helper=
document.getElementById('copyHelper');

helper.value=
document
.getElementById(id)
.innerText
.replace(/\./g,'')
.replace(',','.');

helper.select();

document.execCommand('copy');

}


// HESAP MAKİNESİ

const calcDisplay=
document.getElementById('calcDisplay');

const calcHistory=
document.getElementById('calcHistory');


function updateCalcScreen(){

calcDisplay.innerText=
calcCurrent.replace('.',',');

if(calcOp!=null){

calcHistory.innerText=
`${calcPrev.replace('.',',')}
${calcOp.replace('*','×').replace('/','÷')}`;

}

else{

calcHistory.innerText='';

}

}


function calcInput(number){

const digitCount=str=>{

let s=str.replace(/^-/,'');

if(s.startsWith('0.'))
s=s.slice(1);

return s.replace('.','').length;

};


if(
calcCurrent==='0' &&
number!=='.'
){

calcCurrent=number;

}

else if(shouldResetScreen){

calcCurrent=
number==='.'
?'0.'
:number;

shouldResetScreen=false;

}

else{

if(
number==='.' &&
calcCurrent.includes('.')
)
return;

if(
number!=='.' &&
digitCount(calcCurrent)+
number.toString().length>8
)
return;

calcCurrent+=number.toString();

}

updateCalcScreen();

}


function calcCommand(cmd){

if(cmd==='C'){

calcCurrent='0';
calcPrev='';
calcOp=undefined;

}

else if(cmd==='DEL'){

if(shouldResetScreen)
return;

calcCurrent=
calcCurrent
.toString()
.slice(0,-1);

if(
calcCurrent==='' ||
calcCurrent==='-'
)
calcCurrent='0';

}

else if(cmd==='%'){

calcCurrent=
(parseFloat(calcCurrent)/100)
.toString();

}

else if(
['+','-','*','/'].includes(cmd)
){

if(calcCurrent==='')
return;

if(
calcPrev!=='' &&
!shouldResetScreen
)
computeCalc();

calcOp=cmd;
calcPrev=calcCurrent;
shouldResetScreen=true;

}

else if(cmd==='='){

if(
calcOp==null ||
shouldResetScreen
)
return;

computeCalc();

calcOp=undefined;
calcPrev='';

}

updateCalcScreen();

}


function computeCalc(){

let computation;

const prev=parseFloat(calcPrev);
const current=parseFloat(calcCurrent);

if(
isNaN(prev) ||
isNaN(current)
)
return;


switch(calcOp){

case '+':
computation=prev+current;
break;

case '-':
computation=prev-current;
break;

case '*':
computation=prev*current;
break;

case '/':
computation=
current===0
?0
:prev/current;
break;

default:
return;

}


calcCurrent=
Math.round(
computation*10000000
)/10000000;

calcCurrent=
calcCurrent.toString();

shouldResetScreen=true;

}


// BASILI TUTARAK SİLME

function startDel(){

calcCommand('DEL');

delTimeout=setTimeout(()=>{

delInterval=setInterval(()=>{

calcCommand('DEL');

},80);

},350);

}


function stopDel(){

clearTimeout(delTimeout);
clearInterval(delInterval);

}


// KLAVYE AÇILINCA ALT MENÜYÜ GİZLE

const initialHeight=
window.innerHeight;

const bottomNav=
document.getElementById('bottom-nav');

window.addEventListener(
'resize',
()=>{

if(
window.innerHeight<
initialHeight*.8
){

bottomNav.classList.add(
'nav-hidden'
);

}

else{

bottomNav.classList.remove(
'nav-hidden'
);

}

}
);

</script>

</body>
</html>
